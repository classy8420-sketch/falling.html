<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Catch the Falling Objects</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    font-family: Arial, sans-serif;
  }
  #game-container {
    position: relative;
    width: 400px;
    height: 600px;
    background: #87CEEB;
    border: 4px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #basket {
    position: absolute;
    bottom: 10px;
    width: 80px;
    height: 40px;
    background: #8B4513;
    border-radius: 0 0 15px 15px;
    border-top: 5px solid #A0522D;
    transition: left 0.05s;
  }
  .object {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a);
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .bomb {
    background: radial-gradient(circle at 30% 30%, #333, #000);
    border-radius: 50%;
  }
  .bomb::after {
    content: '💥';
    position: absolute;
    top: -15px;
    left: 5px;
    font-size: 14px;
  }
  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #000;
  }
  #lives {
    position: absolute;
    top: 10px;
    right: 10px;
    color: #fff;
    font-size: 24px;
    text-shadow: 2px 2px 4px #000;
  }
  #game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 30px 40px;
    border-radius: 15px;
    text-align: center;
    display: none;
    z-index: 10;
  }
  #game-over h2 { margin-bottom: 15px; font-size: 32px; }
  #game-over p { margin-bottom: 20px; font-size: 20px; }
  #game-over button {
    padding: 10px 30px;
    font-size: 18px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #game-over button:hover { background: #45a049; }
  #instructions {
    position: absolute;
    bottom: 60px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="score">Score: 0</div>
  <div id="lives">❤️❤️❤️</div>
  <div id="basket"></div>
  <div id="instructions">← → Arrow keys or A/D to move</div>
  <div id="game-over">
    <h2>Game Over!</h2>
    <p>Final Score: <span id="final-score">0</span></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const container = document.getElementById('game-container');
const basket = document.getElementById('basket');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');

const containerWidth = 400;
const basketWidth = 80;
const objectSize = 30;

let basketX = (containerWidth - basketWidth) / 2;
let score = 0;
let lives = 3;
let objects = [];
let keys = {};
let gameRunning = true;
let spawnInterval, gameLoop;

function moveBasket() {
  if (!gameRunning) return;
  const speed = 7;
  if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && basketX > 0) {
    basketX -= speed;
  }
  if ((keys['ArrowRight'] || keys['d'] || keys['D']) && basketX < containerWidth - basketWidth) {
    basketX += speed;
  }
  basket.style.left = basketX + 'px';
}

function spawnObject() {
  if (!gameRunning) return;
  const isBomb = Math.random() < 0.25;
  const obj = document.createElement('div');
  obj.className = 'object' + (isBomb ? ' bomb' : '');
  obj.style.left = Math.random() * (containerWidth - objectSize) + 'px';
  obj.style.top = '-30px';
  container.appendChild(obj);
  objects.push({
    el: obj,
    x: parseFloat(obj.style.left),
    y: -30,
    isBomb: isBomb,
    speed: 2 + Math.random() * 2.5
  });
}

function update() {
  if (!gameRunning) return;
  
  // Move basket
  moveBasket();
  
  // Move objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.y += obj.speed;
    obj.el.style.top = obj.y + 'px';
    
    // Collision detection with basket
    const basketTop = 600 - 10 - 40; // container height - bottom - basket height
    const basketLeft = basketX;
    const basketRight = basketX + basketWidth;
    
    if (obj.y + objectSize >= basketTop && 
        obj.y + objectSize <= basketTop + 40 &&
        obj.x + objectSize > basketLeft && 
        obj.x < basketRight) {
      // Caught!
      obj.el.remove();
      objects.splice(i, 1);
      
      if (obj.isBomb) {
        lives--;
        updateLives();
        if (lives <= 0) {
          endGame();
        }
      } else {
        score += 10;
        scoreEl.textContent = 'Score: ' + score;
      }
      continue;
    }
    
    // Missed - fell off screen
    if (obj.y > 600) {
      obj.el.remove();
      objects.splice(i, 1);
      
      if (!obj.isBomb) {
        lives--;
        updateLives();
        if (lives <= 0) {
          endGame();
        }
      }
    }
  }
  
  requestAnimationFrame(update);
}

function updateLives() {
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
}

function endGame() {
  gameRunning = false;
  clearInterval(spawnInterval);
  finalScoreEl.textContent = score;
  gameOverEl.style.display = 'block';
}

function restartGame() {
  // Clear everything
  objects.forEach(o => o.el.remove());
  objects = [];
  score = 0;
  lives = 3;
  basketX = (containerWidth - basketWidth) / 2;
  basket.style.left = basketX + 'px';
  scoreEl.textContent = 'Score: 0';
  updateLives();
  gameOverEl.style.display = 'none';
  gameRunning = true;
  
  spawnInterval = setInterval(spawnObject, 800);
  requestAnimationFrame(update);
}

// Keyboard controls
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// Touch controls
let touchX = null;
container.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
});
container.addEventListener('touchmove', e => {
  if (touchX === null) return;
  e.preventDefault();
  const rect = container.getBoundingClientRect();
  const newTouchX = e.touches[0].clientX;
  const delta = newTouchX - touchX;
  basketX = Math.max(0, Math.min(containerWidth - basketWidth, basketX + delta));
  basket.style.left = basketX + 'px';
  touchX = newTouchX;
});
container.addEventListener('touchend', () => touchX = null);

// Start game
spawnInterval = setInterval(spawnObject, 800);
requestAnimationFrame(update);
</script>
</body>
</html>
